name: CI

# Python 側と、静的サイトの JS ロジックの両方を検査する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sarif:
    # Code Scanning への書き込み権限は、この job だけに限定する。
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - name: uv のロック済み環境を作成する
        run: uv sync --locked

      # 違反があっても生成済みの SARIF を次の step でアップロードする。
      # CI の成否は python job の --strict に任せ、ここでは役割を分離する。
      - name: reqmodel の SARIF を生成する
        continue-on-error: true
        run: uv run --locked req validate --sarif requirements.py > reqmodel.sarif

      - name: SARIF を Code Scanning へアップロードする
        # fork PR と Dependabot PR では security-events: write が付与されない。
        # 権限を得るために pull_request_target は使わず、安全に upload
        # だけを skip する。SARIF の生成はどの PR でも実行する。
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reqmodel.sarif
          category: reqmodel

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # tests/test_site_js.py が node を呼ぶ (無ければ skip されてしまうので必ず入れる)。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v7

      - name: uv と npm のロック済み環境を作成する
        run: |
          uv sync --locked --extra dev
          npm ci

      - name: テスト
        run: uv run --locked pytest -q

      - name: 型検査
        run: uv run --locked mypy

      # それぞれ別のグラフなので 1 回にまとめない (id が衝突する)。
      # requirements.py はこのリポジトリ自身の要求モデル (dogfooding)。
      - name: 定義ファイルを検証する
        run: |
          uv run --locked req validate --strict requirements.py
          uv run --locked req validate --strict examples/sample.py
          uv run --locked req validate --strict examples/bench.py

  site-js:
    # 埋め込み前の JS を、単体で構文検査してユニットテストにかける。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node 依存をインストール
        run: npm ci

      - name: 構文検査
        run: npm run lint

      - name: ロジックのテスト
        run: npm test

      # 数値は見ないが、ベンチが動かなくなったことには気付けるようにする。
      - name: ベンチ
        run: npm run bench
