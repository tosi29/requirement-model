name: Pages

# 要求グラフの閲覧用サイトをビルドし、GitHub Pages に公開する。
# Pages の設定で Source を "GitHub Actions" にしておくこと。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に 1 つだけ。実行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - name: uv のロック済み環境を作成する
        run: uv sync --locked

      # ツール自体のテストは ci.yml が同じ push で回すので、ここでは繰り返さない。
      # このワークフローが守るのは「検証を通らないモデルを公開しない」ことだけで、
      # 見る条件は CI と揃える (--strict)。
      - name: 定義ファイルを検証する
        run: |
          uv run --locked req validate --strict requirements.py
          uv run --locked req validate --strict examples/sample.py

      # 2 つ公開する。ルートがこのリポジトリ自身の要求モデル、/sample/ が
      # 経費精算システムの例。build_site は 1 回 1 ディレクトリなので 2 回叩く
      # (別のグラフなので 1 回にまとめると id が衝突する)。
      # --repo-url / --repo-ref を渡すと、ノードの出所 (file:line) が
      # 定義ファイルへのリンクになる。参照は公開したコミットそのものにする。
      - name: 静的サイトを生成する
        run: |
          uv run --locked req site requirements.py \
            --output site \
            --title "reqmodel 自身の要求グラフ (requirements.py)" \
            --assets local \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-ref "${{ github.sha }}"
          uv run --locked req site examples/sample.py \
            --output site/sample \
            --title "要求グラフの例 (examples/sample.py)" \
            --assets local \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --repo-ref "${{ github.sha }}"

      - name: 描画ライブラリを同梱する
        # 公開ページから外部への通信を無くすため、描画ライブラリを一緒に置く。
        # ファイル名と URL (バージョン込み) は reqmodel 側の定義を唯一の出典とする。
        # 参照は相対パスなので、ページを置いたディレクトリごとに要る。
        run: |
          uv run --locked python -c "from reqmodel.presentation.site import SITE_ASSETS
          print('\n'.join(f'{a.file} {a.url}' for a in SITE_ASSETS))" |
          while read -r file url; do
            curl -fsSL --retry 3 -o "site/$file" "$url"
            cp "site/$file" "site/sample/$file"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
