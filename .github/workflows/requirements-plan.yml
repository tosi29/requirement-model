name: 要求変更プラン

on:
  pull_request:
    paths:
      - "requirements.py"
      - "requirements/**/*.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - name: reqmodel をインストールする
        run: uv sync --locked
      - name: Markdown の変更プランを生成する
        run: uv run --locked req plan --rev origin/${{ github.event.repository.default_branch }} --format markdown > requirements-plan.md
      - name: PR コメントを作成または更新する
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- reqmodel-plan -->";
            const body = `${marker}\n${fs.readFileSync("requirements-plan.md", "utf8")}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(comment =>
              comment.user.type === "Bot" && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
