[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqmodel"
version = "0.1.0"
description = "要求を型付き有向グラフとして宣言的に記述し、機械的に検証・影響分析するツール"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17.4",
]

[project.scripts]
req = "reqmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# 本体は npm (package-lock.json) で固定し、型解決には uv の .venv を使う。
include = ["src", "examples", "requirements.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ruff]
# target-version は requires-python から導出される。
src = ["src"]
# tools/gen_bench.py の生成物。生成器の出力と一致することをテストで検査している。
extend-exclude = ["examples/bench.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 行長は formatter に任せる。日本語の文字列とコメントは折り返せないため検査しない。
ignore = ["E501"]

[tool.setuptools.package-data]
"reqmodel.presentation" = ["site_template.html", "site_bundle.js"]

[tool.uv]
# uv add / lock / sync で、公開から3日未満の配布物を解決対象にしない。
exclude-newer = "3 days"
