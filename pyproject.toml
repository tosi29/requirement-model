[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqmodel"
version = "0.1.0"
description = "要求を型付き有向グラフとして宣言的に記述し、機械的に検証・影響分析するツール"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[project.scripts]
req = "reqmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "examples", "requirements.py"]

[tool.setuptools.package-data]
"reqmodel.presentation" = ["site_template.html", "site_bundle.js"]

[tool.uv]
# uv add / lock / sync で、公開から3日未満の配布物を解決対象にしない。
exclude-newer = "3 days"
