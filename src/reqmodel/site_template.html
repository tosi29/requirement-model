<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #ffffff;
  --panel: #f7f8fa;
  --border: #dfe3e8;
  --fg: #1f2328;
  --muted: #656d76;
  --accent: #3b6fd4;
  --error: #d93025;
  --severe: #e8710a;
  --warning: #b8860b;
  --info: #5f6368;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --panel: #161b22;
    --border: #2b3440;
    --fg: #e6edf3;
    --muted: #9198a1;
    --accent: #6ea8fe;
    --error: #ff7b72;
    --severe: #ffa657;
    --warning: #e3b341;
    --info: #9198a1;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
}
header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: baseline;
}
header h1 { font-size: 17px; margin: 0; }
header .sub { color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip {
  font-size: 12px;
  padding: 2px 9px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel);
  white-space: nowrap;
}
.chip.error { color: var(--error); border-color: var(--error); }
.chip.severe { color: var(--severe); border-color: var(--severe); }
.chip.warning { color: var(--warning); border-color: var(--warning); }
main {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr) 320px;
  gap: 0;
  height: calc(100vh - 56px);
}
@media (max-width: 1100px) {
  main { grid-template-columns: 1fr; height: auto; }
  .pane { max-height: none !important; }
}
.pane { overflow-y: auto; padding: 14px; border-right: 1px solid var(--border); }
.pane:last-child { border-right: 0; border-left: 1px solid var(--border); }
.graph-pane { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.toolbar {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.graph-frame { flex: 1; position: relative; min-height: 480px; }
#graph { position: absolute; inset: 0; }
#graph .empty { padding: 14px; }
[hidden] { display: none !important; }
.tabs, .tool-group { display: flex; gap: 6px; align-items: center; }
.tabs { margin-right: 6px; }
.tabs button { background: none; }
.tabs button.active { background: var(--panel); border-color: var(--accent); font-weight: 600; }
.table-frame { flex: 1; overflow: auto; min-height: 0; padding: 0 0 14px; }
.table-note { padding: 8px 12px; color: var(--muted); font-size: 12px; }
table.nodes { border-collapse: collapse; width: 100%; font-size: 13px; }
table.nodes th, table.nodes td {
  border-bottom: 1px solid var(--border);
  padding: 5px 10px;
  text-align: left;
  vertical-align: top;
}
table.nodes thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0;
  white-space: nowrap;
}
table.nodes thead th button {
  width: 100%;
  border: 0;
  border-radius: 0;
  background: none;
  color: var(--muted);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: .05em;
  text-align: inherit;
  padding: 7px 10px;
}
table.nodes thead th button:hover { color: var(--fg); background: var(--panel); }
table.nodes thead th[aria-sort="none"] button { color: var(--muted); }
table.nodes thead th:not([aria-sort="none"]) button { color: var(--fg); }
table.nodes .arrow { font-size: 9px; margin-left: 4px; }
table.nodes tbody tr { cursor: pointer; }
table.nodes tbody tr:hover { background: var(--panel); }
table.nodes tbody tr.sel { background: var(--panel); }
table.nodes tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.nodes th:last-child button, table.nodes td:last-child { padding-right: 14px; }
table.nodes td.num, table.nodes th.num, table.nodes th.num button { text-align: right; }
table.nodes td.id { font-weight: 600; white-space: nowrap; }
table.nodes td.type, table.nodes td.status { color: var(--muted); font-size: 12px; white-space: nowrap; }
table.nodes td.text { min-width: 14em; }
table.nodes td.dash { color: var(--border); }
table.nodes .finding-count {
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  background: var(--panel);
}
table.nodes .finding-count.error { color: var(--error); border-color: var(--error); }
table.nodes .finding-count.severe { color: var(--severe); border-color: var(--severe); }
table.nodes .finding-count.warning { color: var(--warning); border-color: var(--warning); }
table.nodes tbody td.empty { padding: 14px; }
h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  margin: 18px 0 8px;
}
h2:first-child { margin-top: 0; }
button, select, input[type="search"] {
  font: inherit;
  font-size: 13px;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
}
input[type="search"] { cursor: text; width: 100%; }
button:hover { border-color: var(--accent); }
label.toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  padding: 2px 0;
  cursor: pointer;
}
label.toggle .count { margin-left: auto; color: var(--muted); font-size: 11px; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { padding: 3px 0; }
.node-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 5px 7px;
  font-size: 13px;
  line-height: 1.4;
}
.node-btn:hover { background: var(--panel); }
.node-btn .id { font-weight: 600; }
.node-btn .type { color: var(--muted); font-size: 11px; }
.node-btn.active { background: var(--panel); outline: 1px solid var(--accent); }
.finding {
  border-left: 3px solid var(--border);
  padding: 5px 9px;
  margin-bottom: 7px;
  background: var(--panel);
  border-radius: 0 6px 6px 0;
  font-size: 12.5px;
  cursor: pointer;
}
.finding.error { border-left-color: var(--error); }
.finding.severe { border-left-color: var(--severe); }
.finding.warning { border-left-color: var(--warning); }
.finding.info { border-left-color: var(--info); }
.finding .code { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
.loc { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
.detail h3 { margin: 0 0 4px; font-size: 15px; }
.detail .text { margin: 0 0 10px; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0 0 12px; font-size: 13px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
.detail .edge { font-family: ui-monospace, monospace; font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend .legend-group { gap: 4px 8px; flex-wrap: wrap; }
.legend .legend-group b { font-weight: 600; color: var(--fg); }
/* 見本の border-* は JS が凡例データから直接書き込む (種別=配色 / status=線種)。 */
.legend .swatch { width: 12px; height: 12px; border: 1px solid; border-radius: 2px; flex: none; }
footer { padding: 10px 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
code { font-family: ui-monospace, monospace; background: var(--panel); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="sub" id="sources"></span>
  <span class="chips" id="stats"></span>
</header>

<main>
  <aside class="pane">
    <h2>ノード検索</h2>
    <input type="search" id="search" placeholder="id / 本文で絞り込む" autocomplete="off">
    <ul class="plain" id="node-list"></ul>

    <h2>ノード種別</h2>
    <div id="type-filters"></div>

    <h2>status</h2>
    <div id="status-filters"></div>

    <h2>優先度</h2>
    <div id="priority-filters"></div>

    <h2>エッジ種別</h2>
    <div id="edge-filters"></div>
    <p class="hint">絞り込みは影響範囲の計算にも効く。外したノード・エッジは経路として辿らない。</p>
  </aside>

  <section class="graph-pane">
    <div class="toolbar">
      <span class="tabs" role="tablist">
        <button id="tab-graph" role="tab" class="active" aria-selected="true" aria-controls="graph-frame">グラフ</button>
        <button id="tab-table" role="tab" aria-selected="false" aria-controls="table-frame">テーブル</button>
      </span>
      <span class="tool-group graph-only" id="graph-tools">
        <button id="zoom-out" title="縮小">−</button>
        <button id="zoom-in" title="拡大">＋</button>
        <button id="zoom-reset">等倍</button>
        <button id="zoom-fit">全体表示</button>
        <select id="direction">
          <option value="TD">縦 (TD)</option>
          <option value="LR">横 (LR)</option>
        </select>
        <!-- 選択肢は site_app.js が FOCUS_DEPTHS から作る。 -->
        <select id="focus" title="選択したノードの近傍だけを図に描く (一覧・表・コピー本文は全体のまま)"></select>
        <button id="relayout" title="表示中のノードだけで並べ直す">整列</button>
      </span>
      <button id="clear">選択解除</button>
      <button id="copy-link" title="いまの表示状態 (選択・絞り込み・表示) の URL をコピーする">リンクをコピー</button>
      <span class="legend graph-only" id="legend"></span>
    </div>
    <div class="graph-frame" id="graph-frame"><div id="graph"></div></div>
    <div class="table-frame" id="table-frame" hidden>
      <p class="table-note" id="table-note"></p>
      <table class="nodes" id="node-table"></table>
    </div>
  </section>

  <aside class="pane detail">
    <h2>ノード詳細</h2>
    <div id="detail"><p class="empty">グラフのノードをクリックすると、本文・受け入れ基準・影響範囲を表示する。</p></div>

    <h2>検証結果</h2>
    <div id="findings"></div>
  </aside>
</main>

<footer>
  静的サイトは <code>req site</code> が生成する。同じデータの生出力は
  <a href="model.json">model.json</a> / <a href="graph.mmd">graph.mmd</a> /
  <a href="graph.dot">graph.dot</a>。
</footer>

<script type="application/json" id="model-data">__DATA__</script>

<script type="module">
__APP_JS__
</script>
</body>
</html>
